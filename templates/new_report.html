{% extends "base.html" %}{% block title %}Add Medical Report | CarePoint{% endblock %}{% block content %}<section class="narrow"><div class="page-heading"><div><span class="eyebrow">CLINICAL DOCUMENTATION · DEMO</span><h1>Add medical report.</h1><p>Only add sample, non-sensitive information for this college prototype.</p></div></div><form class="form-card wide" method="post"><label>Patient<select name="patient_id" required><option value="">Select patient</option>{% for p in patients %}<option value="{{ p.id }}">{{ p.name }} ({{ p.email }})</option>{% endfor %}</select></label><label>Report title<input name="title" maxlength="120" required></label><label>Report date<input type="date" name="report_date" value="{{ today }}" required></label><label>Notes<textarea name="notes" rows="6" maxlength="3000" required></textarea></label><button class="btn" type="submit">Save report →</button></form></section>{% endblock %}
