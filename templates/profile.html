{% extends "base.html" %}{% block title %}My Profile | CarePoint{% endblock %}{% block content %}<section class="narrow"><div class="page-heading"><div><span class="eyebrow">ACCOUNT SETTINGS</span><h1>My profile.</h1><p>Update your contact details.</p></div></div><form class="form-card wide" method="post"><label>Full name<input name="name" value="{{ user.name }}" required></label><label>Email address<input value="{{ user.email }}" disabled></label><label>Mobile number<input name="phone" value="{{ user.phone }}"></label><label>Account role<input value="{{ user.role|title }}" disabled></label><button class="btn" type="submit">Save changes →</button></form></section>{% endblock %}
